<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS 조건문</h1>
    <hr>
    <h1>JS 반복문</h1>
    <script>
        let num = 1;
        let sum_num = 0;
        while(1){
            sum_num += num;
            num ++;
            if (num>100){
            break;
            }
        }
        document.write(sum_num);
    </script>
</body>
</html>
