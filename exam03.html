<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자모양</title>
</head>
<body>
    <h1>글자모양</h1>
    삼육대 <b>인공지능융합학부</b><br>
    삼육대 <i>인공지능융합학부</i><br>
    삼육대 인공지능<sub>융합학부</sub><br>
    삼육대 인공지능<sup>융합학부</sup><br>
    삼육대 <ins>인공지능융합학부</ins><br>
    삼육대 <del>인공지능융합학부</del><br>
    삼육대 <strong>인공지능융합학부</strong><br>
    삼육대 <em>인공지능융합학부</em><br>
    삼육대 <mark>인공지능융합학부</mark><br>
</body>
</html>
